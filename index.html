<title>Endpoint Notebook</title>
<style>
:root{
  --bg:#f6f5f2; --bg-elev:#ffffff; --ink:#1c1b19; --ink-dim:#6b675f; --line:#e3e0d9;
  --accent:#3a4d8f; --mono-bg:#efece4;
  --get:#3d7a4f; --post:#3a5fa0; --put:#a3781f; --patch:#8a5a2b; --delete:#a83f3f;
  --shadow: 0 1px 2px rgba(28,27,25,0.06), 0 4px 14px rgba(28,27,25,0.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17181a; --bg-elev:#1f2023; --ink:#eae8e3; --ink-dim:#9a978f; --line:#302f2c;
    --accent:#8fa3e8; --mono-bg:#242527;
    --get:#6fbf85; --post:#7f9de0; --put:#d3a54c; --patch:#cf9264; --delete:#e07373;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#17181a; --bg-elev:#1f2023; --ink:#eae8e3; --ink-dim:#9a978f; --line:#302f2c;
  --accent:#8fa3e8; --mono-bg:#242527;
  --get:#6fbf85; --post:#7f9de0; --put:#d3a54c; --patch:#cf9264; --delete:#e07373;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
}
:root[data-theme="light"]{
  --bg:#f6f5f2; --bg-elev:#ffffff; --ink:#1c1b19; --ink-dim:#6b675f; --line:#e3e0d9;
  --accent:#3a4d8f; --mono-bg:#efece4;
  --get:#3d7a4f; --post:#3a5fa0; --put:#a3781f; --patch:#8a5a2b; --delete:#a83f3f;
  --shadow: 0 1px 2px rgba(28,27,25,0.06), 0 4px 14px rgba(28,27,25,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14.5px; line-height:1.5; height:100vh; overflow:hidden;
}
.mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.app{ display:grid; grid-template-columns: 310px 1fr; height:100vh; }

.sidebar{ border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; background:var(--bg); }
.brand{ padding:18px 18px 12px; border-bottom:1px solid var(--line); }
.brand h1{ font-size:16px; margin:0 0 2px; font-weight:700; }
.brand p{ margin:0; font-size:12px; color:var(--ink-dim); }

.project-bar{ display:flex; gap:6px; padding:12px 14px; border-bottom:1px solid var(--line); align-items:center; }
.project-select{
  flex:1; padding:7px 8px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg-elev); color:var(--ink); font-size:12.8px; font-weight:600; min-width:0;
}
.icon-btn{
  border:1px solid var(--line); background:var(--bg-elev); color:var(--ink);
  border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
.icon-btn:focus-visible, .search:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}

.tree-toolbar{ display:flex; flex-direction:column; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); }
.tree-toolbar-row{ display:flex; gap:8px; min-width:0; }
.search{ flex:1; min-width:0; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-size:12.8px; }
.text-btn{ flex:1; min-width:0; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-size:12px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.text-btn:hover{ border-color:var(--accent); color:var(--accent); }

.tree{ flex:1; overflow-y:auto; padding:8px; }
.tree-empty{ padding:24px 16px; color:var(--ink-dim); font-size:13px; text-align:center; }
.node{ border-radius:8px; margin-bottom:1px; }
.node-row{ display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:8px; cursor:grab; border:1px solid transparent; position:relative; }
.node-row:hover{ background:var(--bg-elev); }
.node-row.active{ background:var(--bg-elev); border-color:var(--line); box-shadow:var(--shadow); }
.node-row.dragging{ opacity:0.35; }
.node-row.drop-inside{ background:var(--accent); color:var(--accent-ink,#fff); outline:2px dashed var(--accent); outline-offset:-2px; }
.node-row.drop-inside .item-title{ color:inherit; opacity:0.85; }
.node-row.drop-before::before, .node-row.drop-after::after{
  content:""; position:absolute; left:8px; right:8px; height:2px; background:var(--accent); border-radius:2px;
}
.node-row.drop-before::before{ top:-2px; }
.node-row.drop-after::after{ bottom:-2px; }
.chevron{ width:14px; text-align:center; color:var(--ink-dim); font-size:10px; flex-shrink:0; }
.folder-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.row-add-btn{
  flex-shrink:0; width:20px; height:20px; border-radius:6px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink-dim); font-size:13px; line-height:1; cursor:pointer;
  display:none; align-items:center; justify-content:center;
}
.node-row:hover .row-add-btn{ display:flex; }
.row-add-btn:hover{ border-color:var(--accent); color:var(--accent); }
.item-path{ font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-title{ font-size:10.5px; color:var(--ink-dim); }
.node-meta{ min-width:0; display:flex; flex-direction:column; gap:1px; }

.badge{ font-size:9.5px; font-weight:700; letter-spacing:0.04em; padding:2px 5px; border-radius:5px; color:#fff; text-transform:uppercase; flex-shrink:0; }
.badge-GET{ background:var(--get); } .badge-POST{ background:var(--post); } .badge-PUT{ background:var(--put); }
.badge-PATCH{ background:var(--patch); } .badge-DELETE{ background:var(--delete); }

.sidebar-footer{ border-top:1px solid var(--line); padding:10px 12px; display:flex; flex-wrap:wrap; gap:6px; }
.ghost-btn{ flex:1; min-width:80px; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink-dim); font-size:11.5px; cursor:pointer; }
.ghost-btn:hover{ color:var(--ink); border-color:var(--accent); }
.ghost-btn.primary{ border-color:var(--accent); color:var(--accent); font-weight:600; }
input[type=file]{ display:none; }

.share-wrap{ position:relative; flex:1; min-width:100%; }
.share-menu{
  position:absolute; bottom:calc(100% + 6px); left:0; right:0; background:var(--bg-elev);
  border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px; z-index:30;
}
.share-menu button{
  display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; text-align:left;
  padding:8px 10px; border:none; background:transparent; color:var(--ink); font-size:12.5px;
  border-radius:7px; cursor:pointer;
}
.share-menu button:hover:not(:disabled){ background:var(--mono-bg); }
.share-menu button:disabled{ opacity:0.4; cursor:not-allowed; }
.share-menu button small{ color:var(--ink-dim); font-size:11px; }

.main{ overflow-y:auto; padding:26px 40px 80px; }
.empty-state{ height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink-dim); gap:10px; text-align:center; }
.empty-state .glyph{ font-size:34px; opacity:0.5; }

.breadcrumb{ font-size:12px; color:var(--ink-dim); margin-bottom:14px; }
.breadcrumb span.sep{ margin:0 5px; opacity:0.5; }

.editor{ max-width:760px; }
.folder-panel h2{ font-size:22px; margin:0 0 4px; }
.folder-actions{ display:flex; gap:8px; margin:16px 0 22px; flex-wrap:wrap; }
.child-list{ display:flex; flex-direction:column; gap:4px; }
.child-item{ display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg-elev); cursor:pointer; }
.child-item:hover{ border-color:var(--accent); }

.row{ display:flex; gap:10px; align-items:center; margin-bottom:18px; }
select.method{
  appearance:none; -webkit-appearance:none; font-weight:700; font-size:13px; letter-spacing:0.03em; text-transform:uppercase;
  padding:10px 30px 10px 14px; border-radius:8px; border:1px solid var(--line); color:#fff; cursor:pointer;
  background-repeat:no-repeat; background-position:right 10px center; background-size:10px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='white'/></svg>");
}
select.method.GET{ background-color:var(--get); } select.method.POST{ background-color:var(--post); }
select.method.PUT{ background-color:var(--put); } select.method.PATCH{ background-color:var(--patch); } select.method.DELETE{ background-color:var(--delete); }

.path-input{ flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--mono-bg); color:var(--ink); font-size:14px; }
.title-input{ width:100%; border:none; background:transparent; color:var(--ink); font-size:22px; font-weight:700; padding:0 0 4px; margin-bottom:4px; border-bottom:1px solid transparent; }
.title-input:focus{ outline:none; border-bottom:1px solid var(--line); }
.title-input::placeholder{ color:var(--ink-dim); font-weight:700; }

.section{ margin-bottom:26px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.section-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-dim); font-weight:600; }
textarea{ width:100%; resize:vertical; overflow-y:auto; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--mono-bg); color:var(--ink); font-size:12.8px; line-height:1.55; }
textarea.invalid{ border-color:var(--delete); }
.hint{ font-size:11.5px; color:var(--ink-dim); margin-top:5px; }
.hint.err{ color:var(--delete); }

.small-btn{ padding:6px 11px; font-size:12px; border-radius:7px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); cursor:pointer; }
.small-btn:hover{ border-color:var(--accent); color:var(--accent); }
.small-btn.danger:hover{ border-color:var(--delete); color:var(--delete); }

.response{ border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; background:var(--bg-elev); }
.response-head{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.status-input{ width:66px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--mono-bg); color:var(--ink); font-size:12.5px; text-align:center; font-variant-numeric: tabular-nums; }
.status-input.s2{ color:var(--get); font-weight:700; } .status-input.s4{ color:var(--put); font-weight:700; } .status-input.s5{ color:var(--delete); font-weight:700; }
.label-input{ flex:1; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); font-size:12.5px; }
textarea.resp-body{ min-height:90px; }
.rte-toolbar{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.rte-btn{
  min-width:30px; padding:5px 9px; border-radius:6px; border:1px solid var(--line);
  background:var(--bg-elev); color:var(--ink); font-size:12.5px; cursor:pointer;
}
.rte-btn:hover{ border-color:var(--accent); color:var(--accent); }
.rte-btn.active{ border-color:var(--accent); color:var(--accent); background:var(--mono-bg); }
.rte-select{
  padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg-elev);
  color:var(--ink); font-size:12.3px; max-width:130px;
}
.notes-area{
  min-height:70px; font-family:ui-sans-serif,-apple-system,sans-serif; font-size:13px;
  border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--mono-bg); color:var(--ink);
  line-height:1.6;
}
.notes-area:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.notes-area:empty::before{ content:attr(data-placeholder); color:var(--ink-dim); }
.notes-area ul, .notes-area ol{ margin:4px 0; padding-left:22px; }
.move-select{ padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-size:12.3px; }

.topbar{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding-bottom:6px; }
.topbar-left{ display:flex; align-items:center; gap:8px; }

.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.18s ease, transform 0.18s ease; box-shadow:var(--shadow); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }
::-webkit-scrollbar-track{ background:transparent; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <h1>Endpoint Notebook</h1>
      <p>Documentación local de APIs · sin peticiones</p>
    </div>
    <div class="project-bar">
      <select class="project-select" id="projectSelect"></select>
      <button class="icon-btn" id="newProjectBtn" title="Nuevo proyecto">+</button>
      <button class="icon-btn" id="renameProjectBtn" title="Renombrar proyecto">✎</button>
      <button class="icon-btn" id="delProjectBtn" title="Eliminar proyecto">🗑</button>
    </div>
    <div class="tree-toolbar">
      <div class="tree-toolbar-row">
        <input class="search" id="search" type="text" placeholder="Buscar…" />
      </div>
      <div class="tree-toolbar-row">
        <button class="text-btn" id="addFolderBtn">+ Carpeta</button>
        <button class="text-btn" id="addEndpointBtn">+ Endpoint</button>
      </div>
    </div>
    <div class="tree" id="tree"></div>
    <div class="sidebar-footer">
      <div class="share-wrap">
        <button class="ghost-btn primary" id="shareBtn" style="width:100%;">Compartir vista previa ▾</button>
        <div class="share-menu" id="shareMenu" hidden></div>
      </div>
      <button class="ghost-btn" id="exportBtn">JSON</button>
      <button class="ghost-btn" id="exportMdBtn">Markdown</button>
      <button class="ghost-btn" id="importBtn">Importar</button>
      <input type="file" id="importFile" accept="application/json" />
    </div>
  </div>

  <div class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="glyph">◌</div>
      <div>Sin proyectos todavía.</div>
      <div>Crea uno nuevo con el botón “+”.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = "endpoint-notebook-v2";
  const METHODS = ["GET","POST","PUT","PATCH","DELETE"];
  let state = load();
  migrateIfNeeded();
  let activeProjectId = state.projects[0] ? state.projects[0].id : null;
  let activeNodeId = null;
  const expanded = new Set();

  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    // try to migrate from v1 (flat endpoints, no projects)
    try{
      const old = localStorage.getItem("endpoint-notebook-v1");
      if(old){
        const parsed = JSON.parse(old);
        if(parsed.endpoints && parsed.endpoints.length){
          const proj = { id: uid(), name: "Proyecto importado", nodes: [] };
          parsed.endpoints.forEach(e=>{
            proj.nodes.push({ id: e.id||uid(), parentId: null, type:"endpoint",
              title: e.title||"", method: e.method||"GET", path: e.path||"/",
              body: e.body||"", notes: e.notes||"", responses: e.responses||[] });
          });
          return { projects: [proj] };
        }
      }
    }catch(e){}
    return { projects: [] };
  }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function migrateIfNeeded(){
    if(!state.projects) state.projects = [];
    state.projects.forEach(p=>{
      if(!p.nodes) p.nodes = [];
      p.nodes.forEach(n=>{ if(n.parentId===undefined) n.parentId=null; if(n.type==="endpoint" && !n.responses) n.responses=[]; });
    });
  }

  function currentProject(){ return state.projects.find(p=>p.id===activeProjectId) || null; }
  function nodesOf(proj){ return proj ? proj.nodes : []; }
  function findNode(proj, id){ return proj.nodes.find(n=>n.id===id); }
  function children(proj, parentId){ return proj.nodes.filter(n=>n.parentId===parentId); }
  function descendantIds(proj, id){
    const out = [id];
    children(proj,id).forEach(c=>out.push(...descendantIds(proj,c.id)));
    return out;
  }
  function pathToNode(proj, id){
    const parts = [];
    let cur = findNode(proj, id);
    while(cur){ parts.unshift(cur); cur = cur.parentId ? findNode(proj, cur.parentId) : null; }
    return parts;
  }

  function newEndpointNode(parentId){
    return { id: uid(), parentId, type:"endpoint", title:"", method:"GET", path:"/", body:"", notes:"",
      responses:[ { id: uid(), status:"200", label:"Éxito", body:"{\n  \"code\": 0,\n  \"message\": \"Operación exitosa\",\n  \"data\": {}\n}" } ] };
  }
  function newFolderNode(parentId, name){ return { id: uid(), parentId, type:"folder", name: name||"Nueva carpeta" }; }

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
  }
  function statusClass(s){
    const n = parseInt(s,10);
    if(n>=500) return "s5"; if(n>=400) return "s4"; if(n>=200 && n<300) return "s2"; return "";
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // Autosize a textarea to its content; once the user drags the resize handle,
  // remember that height (via setHeight) and stop overriding it on typing.
  // Always fits the textarea to its content as you type. A manual drag-resize
  // (if bigger than the content needs) is remembered as a floor, but typing
  // more text keeps growing it past that floor — it never gets stuck small.
  function bindAutosize(ta, getHeight, setHeight){
    const MIN = 70;
    let floorHeight = getHeight() || 0;
    let settingHeight = false;

    function fitToContent(){
      settingHeight = true;
      ta.style.height = "auto";
      const natural = ta.scrollHeight;
      const target = Math.max(MIN, natural, floorHeight);
      ta.style.height = target + "px";
      requestAnimationFrame(()=>{ settingHeight = false; });
    }
    fitToContent();

    ta.addEventListener("input", fitToContent);

    const ro = new ResizeObserver(()=>{
      if(settingHeight) return;
      const h = Math.round(ta.getBoundingClientRect().height);
      if(h > floorHeight){ floorHeight = h; setHeight(h); }
    });
    ro.observe(ta);
  }

  // ---------- Project bar ----------
  const projectSelect = document.getElementById("projectSelect");
  function renderProjectSelect(){
    projectSelect.innerHTML = "";
    if(state.projects.length===0){
      const opt = document.createElement("option");
      opt.textContent = "Sin proyectos"; opt.value=""; projectSelect.appendChild(opt);
    }
    state.projects.forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p.id; opt.textContent = p.name;
      if(p.id===activeProjectId) opt.selected = true;
      projectSelect.appendChild(opt);
    });
  }
  projectSelect.addEventListener("change", e=>{
    activeProjectId = e.target.value; activeNodeId = null; renderAll();
  });
  document.getElementById("newProjectBtn").addEventListener("click", ()=>{
    const name = prompt("Nombre del nuevo proyecto:", "Nuevo proyecto");
    if(!name) return;
    const proj = { id: uid(), name: name.trim(), nodes: [] };
    state.projects.push(proj); activeProjectId = proj.id; activeNodeId = null;
    save(); renderAll();
  });
  document.getElementById("renameProjectBtn").addEventListener("click", ()=>{
    const proj = currentProject(); if(!proj) return;
    const name = prompt("Renombrar proyecto:", proj.name);
    if(!name) return;
    proj.name = name.trim(); save(); renderAll();
  });
  document.getElementById("delProjectBtn").addEventListener("click", ()=>{
    const proj = currentProject(); if(!proj) return;
    if(!confirm('¿Eliminar el proyecto "'+proj.name+'" y todo su contenido?')) return;
    state.projects = state.projects.filter(p=>p.id!==proj.id);
    activeProjectId = state.projects[0] ? state.projects[0].id : null;
    activeNodeId = null; save(); renderAll();
  });

  // ---------- Tree ----------
  const treeEl = document.getElementById("tree");
  const searchEl = document.getElementById("search");

  function renderTree(){
    const proj = currentProject();
    treeEl.innerHTML = "";
    if(!proj){ treeEl.innerHTML = '<div class="tree-empty">Crea un proyecto para empezar.</div>'; return; }
    const q = searchEl.value.trim().toLowerCase();
    const filtering = !!q;

    function matches(n){
      if(n.type==="folder") return (n.name||"").toLowerCase().includes(q);
      return (n.path||"").toLowerCase().includes(q) || (n.title||"").toLowerCase().includes(q);
    }
    function subtreeMatches(n){
      if(matches(n)) return true;
      return children(proj,n.id).some(subtreeMatches);
    }

    function renderLevel(parentId, depth){
      const list = children(proj, parentId).filter(n=> !filtering || subtreeMatches(n));
      list.forEach(n=>{
        const row = document.createElement("div");
        row.className = "node";
        const isExpanded = filtering || expanded.has(n.id);
        if(n.type==="folder"){

  // ---------- Drag & drop reordering ----------
  let dragId = null;
  function clearDropMarks(){
    treeEl.querySelectorAll(".drop-before,.drop-after,.drop-inside").forEach(el=>{
      el.classList.remove("drop-before","drop-after","drop-inside");
    });
  }
  treeEl.addEventListener("dragstart", e=>{
    const row = e.target.closest(".node-row");
    if(!row) return;
    dragId = row.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", dragId); }catch(err){}
    row.classList.add("dragging");
  });
  treeEl.addEventListener("dragend", ()=>{
    treeEl.querySelectorAll(".node-row.dragging").forEach(el=>el.classList.remove("dragging"));
    clearDropMarks(); dragId = null;
  });
  treeEl.addEventListener("dragover", e=>{
    if(!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const row = e.target.closest(".node-row");
    clearDropMarks();
    if(!row || row.dataset.id===dragId) return;
    const rect = row.getBoundingClientRect();
    const offsetY = e.clientY - rect.top;
    if(row.dataset.type==="folder" && offsetY > rect.height*0.25 && offsetY < rect.height*0.75){
      row.classList.add("drop-inside"); row.dataset.dropMode = "inside";
    } else if(offsetY < rect.height/2){
      row.classList.add("drop-before"); row.dataset.dropMode = "before";
    } else {
      row.classList.add("drop-after"); row.dataset.dropMode = "after";
    }
  });
  treeEl.addEventListener("drop", e=>{
    e.preventDefault();
    if(!dragId) return;
    const proj = currentProject();
    const dragNode = findNode(proj, dragId);
    if(!dragNode) return;
    const row = e.target.closest(".node-row");
    const idx = proj.nodes.indexOf(dragNode);

    if(!row){
      // dropped on empty tree area -> move to root, at the end
      proj.nodes.splice(idx,1);
      dragNode.parentId = null;
      proj.nodes.push(dragNode);
      save(); renderAll(); clearDropMarks(); return;
    }
    const targetId = row.dataset.id;
    if(targetId===dragId){ clearDropMarks(); return; }
    const targetNode = findNode(proj, targetId);
    if(!targetNode) return;
    if(dragNode.type==="folder" && descendantIds(proj, dragNode.id).includes(targetNode.id)){
      toast("No puedes mover una carpeta dentro de sí misma"); clearDropMarks(); return;
    }
    const mode = row.dataset.dropMode || "after";
    proj.nodes.splice(idx,1);
    if(mode==="inside"){
      dragNode.parentId = targetNode.id;
      proj.nodes.push(dragNode);
      expanded.add(targetNode.id);
    } else {
      dragNode.parentId = targetNode.parentId;
      const targetIdx = proj.nodes.indexOf(targetNode);
      proj.nodes.splice(mode==="before" ? targetIdx : targetIdx+1, 0, dragNode);
    }
    save(); renderAll(); clearDropMarks();
  });

  function slug(s){ return (s||"proyecto").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "proyecto"; }

  function toMarkdown(proj){
    let out = "# " + proj.name + "\n\n";
    function walk(parentId, depth){
      children(proj,parentId).forEach(n=>{
        const heading = "#".repeat(Math.min(depth+2,6));
        if(n.type==="folder"){
          out += heading + " 📁 " + n.name + "\n\n";
          walk(n.id, depth+1);
        } else {
          out += heading + " " + (n.title? n.title+" — ":"") + "`" + n.method + " " + n.path + "`\n\n";
          if(n.body && n.body.trim()) out += "**Body:**\n\n```json\n" + n.body.trim() + "\n```\n\n";
          n.responses.forEach(r=>{
            out += "**Respuesta " + (r.status||"") + (r.label? " — "+r.label:"") + ":**\n\n```json\n" + (r.body||"").trim() + "\n```\n\n";
          });
          const notesText = notesToMarkdown(n.notes);
          if(notesText) out += "_Notas:_ " + notesText + "\n\n";
          out += "---\n\n";
        }
      });
    }
    walk(null, 0);
    return out;
  }

  function notesToMarkdown(html){
    if(!html || !html.trim()) return "";
    let s = html;
    s = s.replace(/<(b|strong)[^>]*>(.*?)<\/(b|strong)>/gis, "**$2**");
    s = s.replace(/<(i|em)[^>]*>(.*?)<\/(i|em)>/gis, "*$2*");
    s = s.replace(/<u[^>]*>(.*?)<\/u>/gis, "_$1_");
    s = s.replace(/<s[^>]*>(.*?)<\/s>/gis, "~~$1~~");
    s = s.replace(/<li[^>]*>(.*?)<\/li>/gis, "- $1\n");
    s = s.replace(/<br\s*\/?>/gi, "\n");
    s = s.replace(/<\/(p|div|ul|ol)>/gi, "\n");
    s = s.replace(/<[^>]+>/g, "");
    const ta = document.createElement("textarea");
    ta.innerHTML = s;
    return ta.value.trim();
  }

  function downloadFile(name, content, type){
    const blob = new Blob([content], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

    if(root) root.parentId = null;
    return cloned;
  }

          shareAndDownload(proj.name, proj.nodes.map(n=>JSON.parse(JSON.stringify(n))));

          const clone = JSON.parse(JSON.stringify(node)); clone.parentId = null;
          shareAndDownload((node.title||node.path||"endpoint"), [clone]);
        }
      });
    });
